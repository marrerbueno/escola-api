services:
  - type: web
    name: escola-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx vite preview --host 0.0.0.0 --port 4173
    envVars:
      - key: VITE_API_URL
        value: https://escola-api-nhrw.onrender.com/api